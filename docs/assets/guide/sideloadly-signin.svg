<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="380" height="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Sideloadly asks for your Apple Account password, then for the verification code.</title>
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.28"/></filter><clipPath id="wc"><rect x="0.5" y="0.5" width="379" height="249" rx="10"/></clipPath></defs><rect x="0.5" y="0.5" width="379" height="249" rx="10" fill="#2b2b2b"/><g clip-path="url(#wc)"><rect x="0" y="0" width="380" height="30" fill="#363636"/></g><rect x="0.5" y="30" width="379" height="1" fill="#1e1e1e"/><text x="190" y="20" font-size="12" fill="#dedede" font-weight="600" text-anchor="middle">Sideloadly!</text><rect x="24" y="40" width="332" height="94" rx="8" fill="#3a3a3a" stroke="#5a5a5a" stroke-width="1" filter="url(#sh)"/><text x="38" y="62" font-size="12.5" fill="#f0f0f0" font-weight="700">Apple Account password</text><text x="38" y="80" font-size="11" fill="#cfcfcf">Enter the password for name@icloud.com.</text><rect x="38" y="86" width="200" height="20" rx="4" fill="#1f1f1f" stroke="#5a5a5a" stroke-width="1"/><text x="46" y="100.14" font-size="11.5" fill="#f0f0f0">••••••••••</text><rect x="258" y="102" width="40" height="20" rx="5" fill="#4a4a4a" stroke="#666" stroke-width="1"/><text x="278" y="115.96" font-size="11" fill="#e8e8e8" font-weight="500" text-anchor="middle">Cancel</text><rect x="306" y="102" width="36" height="20" rx="5" fill="#2f6fe4"/><text x="324" y="115.96" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">OK</text><rect x="24" y="142" width="332" height="94" rx="8" fill="#3a3a3a" stroke="#5a5a5a" stroke-width="1" filter="url(#sh)"/><text x="38" y="164" font-size="12.5" fill="#f0f0f0" font-weight="700">Verification code</text><text x="38" y="182" font-size="11" fill="#cfcfcf">Enter the six-digit code shown on your</text><text x="38" y="196" font-size="11" fill="#cfcfcf">other Apple devices, or sent by text.</text><rect x="38" y="202" width="200" height="20" rx="4" fill="#1f1f1f" stroke="#5a5a5a" stroke-width="1"/><text x="46" y="216.14" font-size="11.5" fill="#8a8a8a">— — — — — —</text><rect x="258" y="204" width="40" height="20" rx="5" fill="#4a4a4a" stroke="#666" stroke-width="1"/><text x="278" y="217.96" font-size="11" fill="#e8e8e8" font-weight="500" text-anchor="middle">Cancel</text><rect x="306" y="204" width="36" height="20" rx="5" fill="#2f6fe4"/><text x="324" y="217.96" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">OK</text><rect x="0.5" y="0.5" width="379" height="249" rx="10" fill="none" stroke="#505050" stroke-width="1"/>
</svg>
