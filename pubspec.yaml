name: gramx
description: "An Android client for Telegram channels, laid out as a timeline."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Material's own strings, and the text direction that comes with a locale.
  # gramX ships English only — every string of its own is in
  # `core/l10n/app_strings.dart` — but without these delegates the framework's
  # widgets (the text selection menu, date pickers, semantics) are English on
  # every device regardless, and there is no locale for the app to react to.
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.2

  # TDLib wrapper
  handy_tdlib: ^2.3.9


  # Navigation
  go_router: ^17.2.3

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Database
  drift: ^2.34.1
  drift_flutter: ^0.3.0

  # Security
  flutter_secure_storage: ^9.2.4

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  video_player: ^2.9.2

  # Utilities
  intl: ^0.20.2
  timeago: ^3.7.0
  uuid: ^4.5.1
  path_provider: ^2.1.5
  path: ^1.9.1
  url_launcher: ^6.3.2
  country_picker: ^2.0.28
  visibility_detector: ^0.4.0+2

  # Telling TDLib which network it is on. TDLib's own documentation requires
  # `setNetworkType` to be called on every network change — the call is what
  # forces its connections to reopen — and Flutter has no way to observe one
  # without a platform plugin. Used for exactly that, in
  # `infrastructure/telegram/tdlib_lifecycle.dart`, and nowhere else.
  connectivity_plus: ^6.1.0

  # Deep links. A Telegram client that cannot open a t.me link is the one
  # link every post in it renders. This delivers
  # the launch link and the ones that arrive while running; what they mean is
  # decided in `core/navigation/telegram_link.dart`, which is pure.
  app_links: ^6.3.2

  # Showing a notification. TDLib decides *what* should be notified and keeps
  # the groups in step across the reader's devices; it has no way to draw one,
  # which is what this is for.
  flutter_local_notifications: ^18.0.1
  lottie: ^3.5.1
  open_filex: ^4.7.0

  # Composing: picking a photo or video off the device to attach to a post.
  # Gallery only. The camera is reached through `camera` below, and only from
  # the one control that needs it.
  image_picker: ^1.1.2

  # Guest mode only: fetching and parsing t.me/s/<channel> preview pages.
  # Nothing else in the app makes an HTTP request of its own — signed-in
  # traffic all goes through TDLib.
  http: ^1.2.2
  html: ^0.15.5
  # Attaching a file that is not a picture. Uses the platform's own document
  # picker (SAF on Android, UIDocumentPicker on iOS), which hands back a single
  # file the app has been granted — so it needs no storage permission of its
  # own.
  file_picker: ^11.0.3

  # Recording a voice message. Configured for Opus in an OGG container, which
  # is what `inputMessageVoiceNote` wants — anything else arrives in other
  # Telegram clients as a file rather than a playable waveform. Needs the
  # microphone permission, asked for at the moment the reader holds the button.
  record: ^7.1.1

  # One position fix, for sending a location. Never a stream and never in the
  # background: gramX asks once, when somebody taps "send my location", and
  # stops.
  geolocator: ^14.0.2

  # Recording a round video message. The only thing in the app that opens the
  # camera, and the only reason the camera permission is declared.
  camera: ^0.12.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  freezed: ^3.2.5
  json_serializable: ^6.9.4
  drift_dev: ^2.27.0



flutter:
  uses-material-design: true

  assets:
    # The brand delivery: the launcher icon in both grounds, shown on the
    # sign-in screen so the app introduces itself with the artwork someone just
    # tapped, and the mark's own animation, which is what the splash and the
    # connecting screen wait on. The launcher icons the OS draws are not here —
    # those are platform resources under `android/.../res` and
    # `ios/Runner/Assets.xcassets`, built from the same delivery.
    - assets/brand/
