name: gramx
description: "An Android client for Telegram channels, laid out as a timeline."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.2

  # TDLib wrapper
  handy_tdlib: ^2.3.9


  # Navigation
  go_router: ^17.2.3

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Database
  drift: ^2.34.1
  drift_flutter: ^0.3.0

  # Security
  flutter_secure_storage: ^9.2.4

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  video_player: ^2.9.2

  # Utilities
  intl: ^0.20.2
  timeago: ^3.7.0
  uuid: ^4.5.1
  path_provider: ^2.1.5
  path: ^1.9.1
  url_launcher: ^6.3.2
  country_picker: ^2.0.28
  visibility_detector: ^0.4.0+2

  # Telling TDLib which network it is on. TDLib's own documentation requires
  # `setNetworkType` to be called on every network change — the call is what
  # forces its connections to reopen — and Flutter has no way to observe one
  # without a platform plugin. Used for exactly that, in
  # `infrastructure/telegram/tdlib_lifecycle.dart`, and nowhere else.
  connectivity_plus: ^6.1.0
  lottie: ^3.5.1
  open_filex: ^4.7.0

  # Composing: picking a photo or video off the device to attach to a post.
  # Gallery only — nothing here opens the camera, so the app asks for no
  # camera permission.
  image_picker: ^1.1.2

  # Guest mode only: fetching and parsing t.me/s/<channel> preview pages.
  # Nothing else in the app makes an HTTP request of its own — signed-in
  # traffic all goes through TDLib.
  http: ^1.2.2
  html: ^0.15.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  freezed: ^3.2.5
  json_serializable: ^6.9.4
  drift_dev: ^2.27.0



flutter:
  uses-material-design: true

  assets:
    # The launcher mark, shown on the sign-in screen so the app introduces
    # itself with the icon someone just tapped.
    - assets/icon/app_icon.png
