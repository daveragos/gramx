name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      # The real config holds the developer's Telegram API keys and is not in
      # the repository. The example compiles, and nothing in the tests talks
      # to Telegram.
      - name: Use the example config
        run: cp lib/core/config/app_config.example.dart lib/core/config/app_config.dart

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
